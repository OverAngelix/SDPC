# Le client prend tout le domaine ; /api est repris par la route du serveur (règle plus longue)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: <APP>-client
  namespace: dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`<DOMAINE>`)
      kind: Rule
      services:
        - name: <APP>-client
          port: 80
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: <APP>-client-http
  namespace: dev
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`<DOMAINE>`)
      kind: Rule
      services:
        - name: <APP>-client
          port: 80
      middlewares:
        - name: https-redirect
