# Le client porte le domaine ; /api part vers le serveur (règle plus longue, sans stripPrefix)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: <APP>-client
  namespace: dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`<DOMAINE>`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: <APP>-server
          port: <PORT>
    - match: Host(`<DOMAINE>`)
      kind: Rule
      services:
        - name: <APP>-client
          port: 80
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: <APP>-client-http
  namespace: dev
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`<DOMAINE>`)
      kind: Rule
      services:
        - name: <APP>-client
          port: 80
      middlewares:
        - name: https-redirect
