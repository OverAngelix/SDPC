# Accès direct à l'API sur son propre sous-domaine (le client, lui, passe par /api de son ingressroute)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: <APP>-server
  namespace: dev
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`<API_DOMAINE>`)
      kind: Rule
      services:
        - name: <APP>-server
          port: <PORT>
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: <APP>-server-http
  namespace: dev
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`<API_DOMAINE>`)
      kind: Rule
      services:
        - name: <APP>-server
          port: <PORT>
      middlewares:
        - name: https-redirect
